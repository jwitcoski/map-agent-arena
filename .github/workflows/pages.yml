name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from secrets
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("admin-boundaries/js/config.js")
          path.parent.mkdir(parents=True, exist_ok=True)
          mb = os.environ.get("MAPBOX_ACCESS_TOKEN") or ""
          mt = os.environ.get("MAPTILER_API_KEY") or ""
          gg = os.environ.get("GOOGLE_MAPS_API_KEY") or ""
          az = os.environ.get("AZURE_MAPS_SUBSCRIPTION_KEY") or ""
          tt = os.environ.get("TOMTOM_API_KEY") or ""
          path.write_text(
              "// Generated by GitHub Actions - do not commit.\n"
              f"window.MAPBOX_ACCESS_TOKEN = {json.dumps(mb)};\n"
              f"window.MAPTILER_API_KEY = {json.dumps(mt)};\n"
              f"window.GOOGLE_MAPS_API_KEY = {json.dumps(gg)};\n"
              f"window.AZURE_MAPS_SUBSCRIPTION_KEY = {json.dumps(az)};\n"
              f"window.TOMTOM_API_KEY = {json.dumps(tt)};\n",
              encoding="utf-8",
          )
          print("wrote", path, "mapbox=", bool(mb), "maptiler=", bool(mt), "google=", bool(gg), "azure=", bool(az), "tomtom=", bool(tt))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
