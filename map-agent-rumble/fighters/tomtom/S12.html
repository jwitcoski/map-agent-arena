<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S12 Layer Studio - TomTom</title>
  <!-- Agent skills: https://github.com/tomtom-international/maps-sdk-js | install: npm i @tomtom-international/web-sdk-maps (CDN: Maps SDK for Web v6) | local: .agents/skills -->
  <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css" />
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  <script src="../../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel button, .panel input {
      font: inherit; margin: 4px 0; width: 100%; box-sizing: border-box;
      border-radius: 8px; border: 1px solid #445; padding: 10px; min-height: 44px;
      background: #0f172a; color: #eef2ff; cursor: pointer; touch-action: manipulation;
    }
    .panel button { background: #2563eb; border-color: #3b82f6; }
    .legend { position: absolute; z-index: 2; bottom: 28px; left: 10px;
      background: rgba(10,16,32,.9); color: #eef2ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #inset, #overview {
      position: absolute; z-index: 2; right: 10px; bottom: 28px;
      width: 140px; height: 110px; border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    }
    .story { position: absolute; z-index: 2; top: 10px; right: 10px; width: min(280px, 40vw);
      max-height: 80vh; overflow: auto; background: rgba(10,16,32,.94); color: #eef2ff;
      padding: 12px; border-radius: 10px; }
    .story .chapter { border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 0; cursor: pointer; }
    .story .chapter.active { color: #6ec8ff; }
    .swipe-wrap { position: absolute; inset: 0; }
    .swipe-wrap #mapA, .swipe-wrap #mapB { position: absolute; inset: 0; }
    .swipe-bar { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 5; cursor: ew-resize; }
    @media (max-width: 520px) {
      .panel { max-width: 96vw; left: 2vw; right: 2vw; width: auto; }
      .panel button { min-height: 48px; padding: 12px; }
    }
</style>
</head>
<body>

<div class="panel">
  <strong>Layer studio</strong>
  <label><input type="checkbox" data-layer="heat" checked /> Heat circles</label>
  <label><input type="checkbox" data-layer="line" checked /> Corridor</label>
  <label><input type="checkbox" data-layer="pts" checked /> Sites</label>
  <label>Opacity <input id="op" type="range" min="0" max="100" value="70" /></label>
  <label>Filter <input id="filt" type="range" min="0" max="10" value="0" /></label>
  <div class="legend">Legend: heat · corridor · sites</div>
</div>
<div id="map"></div>
<script>

  const key = window.TOMTOM_API_KEY;
  if (!key || key === "YOUR_TOMTOM_API_KEY") {
    document.body.innerHTML = '<div style="margin:0;display:flex;align-items:center;justify-content:center;height:100%;background:#05090e;color:#fbbf24;font:600 13px system-ui;padding:16px;text-align:center">Missing TOMTOM_API_KEY — set GitHub secret TOMTOM_API_KEY (Pages) or map-agent-rumble/admin-boundaries/js/config.js (local).</div>';
    throw new Error("Missing TOMTOM_API_KEY");
  }
  tt.setProductInfo("map-agent-arena", "1.0");
  
  const map = tt.map({ key, container: "map", center: [14.4178, 50.1167], zoom: 12 });
  map.on("load", () => {
    map.addSource("heat", { type: "geojson", data: { type: "FeatureCollection", features: [
      { type: "Feature", geometry: { type: "Point", coordinates: [14.42, 50.11] } },
      { type: "Feature", geometry: { type: "Point", coordinates: [14.40, 50.09] } }
    ]}});
    map.addSource("line", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: [[14.40, 50.12], [14.43, 50.08]] } } });
    map.addSource("pts", { type: "geojson", data: { type: "FeatureCollection", features: [
      { type: "Feature", properties: { id: 0 }, geometry: { type: "Point", coordinates: [14.41, 50.10] } },
      { type: "Feature", properties: { id: 1 }, geometry: { type: "Point", coordinates: [14.42, 50.085] } }
    ]}});
    map.addLayer({ id: "heat", type: "circle", source: "heat", paint: { "circle-radius": 40, "circle-color": "#f87171", "circle-opacity": 0.35 } });
    map.addLayer({ id: "line", type: "line", source: "line", paint: { "line-color": "#6ec8ff", "line-width": 4 } });
    map.addLayer({ id: "pts", type: "circle", source: "pts", paint: { "circle-radius": 6, "circle-color": "#fb923c" } });
    document.querySelectorAll("[data-layer]").forEach((el) => {
      el.addEventListener("change", () => {
        map.setLayoutProperty(el.getAttribute("data-layer"), "visibility", el.checked ? "visible" : "none");
      });
    });
    document.getElementById("op").oninput = (e) => {
      const o = Number(e.target.value) / 100;
      map.setPaintProperty("heat", "circle-opacity", o * 0.5);
      map.setPaintProperty("line", "line-opacity", o);
    };
    
    };
  });
  window.__MAP__ = map;
</script>
</body>
</html>
