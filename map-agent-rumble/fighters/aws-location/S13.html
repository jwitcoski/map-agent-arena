<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S13 Swipe - AWS Location</title>
  <!-- Agent skills: https://github.com/cline/skills/tree/main/skills/amazon-location-service | install: npx skills add cline/skills --skill amazon-location-service -a cursor | local: .agents/skills/amazon-location-service -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel button, .panel input {
      font: inherit; margin: 4px 0; width: 100%; box-sizing: border-box;
      border-radius: 8px; border: 1px solid #445; padding: 10px; min-height: 44px;
      background: #0f172a; color: #eef2ff; cursor: pointer; touch-action: manipulation;
    }
    .panel button { background: #2563eb; border-color: #3b82f6; }
    .legend { position: absolute; z-index: 2; bottom: 28px; left: 10px;
      background: rgba(10,16,32,.9); color: #eef2ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #inset, #overview {
      position: absolute; z-index: 2; right: 10px; bottom: 28px;
      width: 140px; height: 110px; border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    }
    .story { position: absolute; z-index: 2; top: 10px; right: 10px; width: min(280px, 40vw);
      max-height: 80vh; overflow: auto; background: rgba(10,16,32,.94); color: #eef2ff;
      padding: 12px; border-radius: 10px; }
    .story .chapter { border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 0; cursor: pointer; }
    .story .chapter.active { color: #6ec8ff; }
    .swipe-wrap { position: absolute; inset: 0; }
    .swipe-wrap #mapA, .swipe-wrap #mapB { position: absolute; inset: 0; }
    .swipe-bar { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 5; cursor: ew-resize; }
    @media (max-width: 520px) {
      .panel { max-width: 96vw; left: 2vw; right: 2vw; width: auto; }
      .panel button { min-height: 48px; padding: 12px; }
    }
</style>
</head>
<body>

<style>
  #wrap{position:relative;height:100%;}
  #mapA,#mapB{position:absolute;inset:0;}
  #mapB{clip-path: inset(0 0 0 50%);}
  #bar{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#fff;z-index:3;cursor:ew-resize;}
</style>
<div id="wrap">
  <div id="mapA"></div>
  <div id="mapB"></div>
  <div id="bar"></div>
</div>
<script>

  const key = window.AWS_LOCATION_API_KEY;
  const region = window.AWS_LOCATION_REGION || "us-east-1";
  function styleUrl(name, scheme) {
    let u = "https://maps.geo." + region + ".amazonaws.com/v2/styles/" + name +
      "/descriptor?key=" + encodeURIComponent(key);
    if (scheme) u += "&color-scheme=" + scheme;
    return u;
  }
  function placesUrl(path) {
    return "https://places.geo." + region + ".amazonaws.com/v2/" + path +
      "?key=" + encodeURIComponent(key);
  }
  function routesUrl() {
    return "https://routes.geo." + region + ".amazonaws.com/v2/routes?key=" +
      encodeURIComponent(key);
  }
  
  const a = new maplibregl.Map({
    container: "mapA", style: styleUrl("Standard", "Light"), center: [14.4178, 50.1167], zoom: 12
  });
  const b = new maplibregl.Map({
    container: "mapB", style: styleUrl("Hybrid", "Light"), center: [14.4178, 50.1167], zoom: 12
  });
  function bind(x, y) {
    x.on("move", () => {
      if (y.__lock) return;
      y.__lock = true;
      y.jumpTo({ center: x.getCenter(), zoom: x.getZoom() });
      y.__lock = false;
    });
  }
  bind(a, b); bind(b, a);
  const bar = document.getElementById("bar");
  const mapB = document.getElementById("mapB");
  bar.onpointerdown = () => {
    const move = (ev) => {
      const r = document.getElementById("wrap").getBoundingClientRect();
      const pct = Math.min(90, Math.max(10, ((ev.clientX - r.left) / r.width) * 100));
      bar.style.left = pct + "%";
      mapB.style.clipPath = "inset(0 0 0 " + pct + "%)";
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };
  window.__MAP__ = a;
</script>
</body>
</html>
