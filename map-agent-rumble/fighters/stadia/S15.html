<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S15 On-street Drive - Stadia</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel button, .panel input {
      font: inherit; margin: 4px 0; width: 100%; box-sizing: border-box;
      border-radius: 8px; border: 1px solid #445; padding: 10px; min-height: 44px;
      background: #0f172a; color: #eef2ff; cursor: pointer; touch-action: manipulation;
    }
    .panel button { background: #2563eb; border-color: #3b82f6; }
    .legend { position: absolute; z-index: 2; bottom: 28px; left: 10px;
      background: rgba(10,16,32,.9); color: #eef2ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #inset, #overview {
      position: absolute; z-index: 2; right: 10px; bottom: 28px;
      width: 140px; height: 110px; border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    }
    .story { position: absolute; z-index: 2; top: 10px; right: 10px; width: min(280px, 40vw);
      max-height: 80vh; overflow: auto; background: rgba(10,16,32,.94); color: #eef2ff;
      padding: 12px; border-radius: 10px; }
    .story .chapter { border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 0; cursor: pointer; }
    .story .chapter.active { color: #6ec8ff; }
    .swipe-wrap { position: absolute; inset: 0; }
    .swipe-wrap #mapA, .swipe-wrap #mapB { position: absolute; inset: 0; }
    .swipe-bar { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 5; cursor: ew-resize; }
    @media (max-width: 520px) {
      .panel { max-width: 96vw; left: 2vw; right: 2vw; width: auto; }
      .panel button { min-height: 48px; padding: 12px; }
    }
</style>
</head>
<body>

<div class="panel">
  <strong>Drive</strong>
  <p>Arrow keys / WASD · follow cam on street route</p>
</div>
<div id="map"></div>
<script>

  const key = window.STADIA_API_KEY;
  function styleUrl(name) {
    return "https://tiles.stadiamaps.com/styles/" + name + ".json?api_key=" + encodeURIComponent(key);
  }
  
  const map = new maplibregl.Map({
    container: "map", style: styleUrl("alidade_smooth"),
    center: [14.4178, 50.1167], zoom: 15, pitch: 45
  });
  let path = [], progress = 0, keys = {}, car = null;
  function decodePolyline6(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
      let b, shift = 0, result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      coordinates.push([lng / 1e6, lat / 1e6]);
    }
    return coordinates;
  }
  map.on("load", async () => {
    car = new maplibregl.Marker().setLngLat([14.4178, 50.1167]).addTo(map);
    const res = await fetch("https://api.stadiamaps.com/route/v1?api_key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        locations: [{ lat: 50.1167, lon: 14.4178 }, { lat: 50.0865, lon: 14.4005 }],
        costing: "auto"
      })
    });
    const data = await res.json();
    const shape = (((data.trip || {}).legs || [])[0] || {}).shape;
    path = shape ? decodePolyline6(shape) : [];
    if (path.length > 1) {
      map.addSource("track", { type: "geojson", data: {
        type: "Feature", geometry: { type: "LineString", coordinates: path }
      }});
      map.addLayer({ id: "track", type: "line", source: "track",
        paint: { "line-color": "#6ec8ff", "line-width": 4 } });
    }
  });
  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  function tick() {
    if (path.length > 1 && car) {
      if (keys["arrowup"] || keys.w) progress = Math.min(1, progress + 0.004);
      if (keys["arrowdown"] || keys.s) progress = Math.max(0, progress - 0.004);
      const i = Math.min(path.length - 2, Math.floor(progress * (path.length - 1)));
      const t = progress * (path.length - 1) - i;
      const a = path[i], b = path[i + 1];
      const pos = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      car.setLngLat(pos);
      map.setCenter(pos);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__MAP__ = map;
</script>
</body>
</html>
