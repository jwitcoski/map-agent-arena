<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N02 Geocode + Route - CARTO</title>
  <!-- Agent skills: https://github.com/CartoDB/agent-skills | install: npx skills add CartoDB/agent-skills -a cursor | local: .agents/skills/carto-develop-app -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel button, .panel input {
      font: inherit; margin: 4px 0; width: 100%; box-sizing: border-box;
      border-radius: 8px; border: 1px solid #445; padding: 10px; min-height: 44px;
      background: #0f172a; color: #eef2ff; cursor: pointer; touch-action: manipulation;
    }
    .panel button { background: #2563eb; border-color: #3b82f6; }
    .legend { position: absolute; z-index: 2; bottom: 28px; left: 10px;
      background: rgba(10,16,32,.9); color: #eef2ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #inset, #overview {
      position: absolute; z-index: 2; right: 10px; bottom: 28px;
      width: 140px; height: 110px; border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    }
    .story { position: absolute; z-index: 2; top: 10px; right: 10px; width: min(280px, 40vw);
      max-height: 80vh; overflow: auto; background: rgba(10,16,32,.94); color: #eef2ff;
      padding: 12px; border-radius: 10px; }
    .story .chapter { border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 0; cursor: pointer; }
    .story .chapter.active { color: #6ec8ff; }
    .swipe-wrap { position: absolute; inset: 0; }
    .swipe-wrap #mapA, .swipe-wrap #mapB { position: absolute; inset: 0; }
    .swipe-bar { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 5; cursor: ew-resize; }
    @media (max-width: 520px) {
      .panel { max-width: 96vw; left: 2vw; right: 2vw; width: auto; }
      .panel button { min-height: 48px; padding: 12px; }
    }
</style>
</head>
<body>

<div class="panel">
  <input id="from" placeholder="From" value="Old Town Square, Prague" />
  <input id="to" placeholder="To" value="Prague Castle" />
  <button type="button" id="go">Route</button>
</div>
<div id="map"></div>
<script>

  const token = window.CARTO_API_ACCESS_TOKEN;
  const base = (window.CARTO_API_BASE_URL || "https://gcp-us-east1.api.carto.com").replace(//$/, "");
  function styleUrl(name) {
    return "https://basemaps.cartocdn.com/gl/" + name + "/style.json";
  }
  function authHeaders() {
    return { Authorization: "Bearer " + token };
  }
  function lds(path, params) {
    const q = new URLSearchParams(params || {});
    return base + "/v3/lds/" + path + (q.toString() ? "?" + q.toString() : "");
  }
  function pickCoords(data) {
    return (
      (data && data.geojson && data.geojson.geometry && data.geojson.geometry.coordinates) ||
      (data && data.geojson && data.geojson.coordinates) ||
      (data && data.geometry && data.geometry.coordinates) ||
      (data && data.result && data.result.geometry && data.result.geometry.coordinates) ||
      (data && data.coordinates) ||
      (data && data.lng != null ? [data.lng, data.lat] : null) ||
      (data && data.lon != null ? [data.lon, data.lat] : null)
    );
  }
  function pickGeom(data) {
    return (
      (data && data.geojson && data.geojson.geometry) ||
      (data && data.geometry) ||
      (data && data.result && data.result.geometry) ||
      (data && data.geojson && data.geojson.type ? data.geojson : null)
    );
  }
  function pickLabel(data) {
    return (
      (data && data.geojson && data.geojson.properties && (data.geojson.properties.label || data.geojson.properties.address)) ||
      (data && data.formatted_address) ||
      (data && data.address) ||
      (data && data.label) ||
      (data && data.result && (data.result.label || data.result.address)) ||
      ""
    );
  }
  
  const map = new maplibregl.Map({
    container: "map", style: styleUrl("positron-gl-style"), center: [14.4178, 50.1167], zoom: 12
  });
  async function geocode(q) {
    const data = await (await fetch(lds("geocoding/geocode", { address: q }), { headers: authHeaders() })).json();
    const c = pickCoords(data);
    if (!c) throw new Error("geocode miss");
    return c;
  }
  document.getElementById("go").onclick = async () => {
    const data = await (await fetch(lds("routing", {
      waypoints: "14.4178,50.1167;14.4005,50.0865",
      mode: "car"
    }), { headers: authHeaders() })).json();
    const g = pickGeom(data);
    const coords = (g && g.coordinates) || (g && g.geometry && g.geometry.coordinates) || [];
    if (map.getSource("route")) { map.removeLayer("route"); map.removeSource("route"); }
    map.addSource("route", { type: "geojson", data: {
      type: "Feature", geometry: { type: "LineString", coordinates: coords }
    }});
    map.addLayer({ id: "route", type: "line", source: "route",
      paint: { "line-width": 5, "line-color": "#2fb67c" } });
  };
  window.__MAP__ = map;
</script>
</body>
</html>
