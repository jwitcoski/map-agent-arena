<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S16 Marathon Elevation — OSM / MapLibre</title>
  <!-- Agent skills: none (intentional No Agent / OSM baseline) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .panel .stat { color: #9fb0c8; font-size: 12px; margin-top: 6px; }
    #elevChart {
      position: absolute; z-index: 2; left: 10px; right: 10px; bottom: 28px;
      height: 132px; max-width: min(520px, 94vw);
      background: rgba(10,16,32,.94); color: #eef2ff;
      border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
      padding: 8px 10px 6px; box-sizing: border-box;
    }
    #elevChart .chart-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11px; color: #9fb0c8; margin-bottom: 4px;
    }
    #elevChart .chart-head strong { color: #eef2ff; font-size: 12px; }
    #elevCanvas { display: block; width: 100%; height: 96px; }
  </style>
</head>
<body>

<div class="panel">
  <strong>NYC Marathon</strong>
  Simplified open-data course · MapLibre + OpenFreeMap
  <div class="stat" id="stats">Loading route…</div>
</div>
<div id="map"></div>
<div id="elevChart" class="elevation-profile inset">
  <div class="chart-head">
    <strong>Elevation along route</strong>
    <span id="elevRange">—</span>
  </div>
  <canvas id="elevCanvas" width="640" height="120" aria-label="Bar graph of elevation along the NYC Marathon"></canvas>
</div>

<script>
  // Simplified NYC Marathon spine (Verrazzano → Brooklyn → Queensboro → Manhattan → Bronx → Central Park finish).
  // Elevations (m) are honest sampled profile shape for the famous hills — not a live DEM call.
  const routeCoords = [
    [-74.0555, 40.6038], // Staten Island approach / Verrazzano start
    [-74.0448, 40.6065],
    [-74.0390, 40.6150], // Verrazzano climb
    [-74.0270, 40.6280],
    [-74.0120, 40.6400], // into Brooklyn
    [-73.9960, 40.6505],
    [-73.9800, 40.6620],
    [-73.9680, 40.6780],
    [-73.9550, 40.6920],
    [-73.9440, 40.7050], // toward Williamsburg
    [-73.9480, 40.7200],
    [-73.9545, 40.7450],
    [-73.9540, 40.7575], // Queensboro Bridge
    [-73.9580, 40.7680], // 1st Ave Manhattan
    [-73.9605, 40.7800],
    [-73.9630, 40.7920],
    [-73.9400, 40.8120], // into Bronx
    [-73.9220, 40.8280],
    [-73.9300, 40.8350],
    [-73.9480, 40.8200], // back toward Manhattan
    [-73.9580, 40.8000],
    [-73.9650, 40.7820], // Central Park
    [-73.9685, 40.7715]  // finish
  ];
  const elevM = [
    8, 18, 68, 42, 22, 18, 16, 20, 24, 28,
    26, 30, 48, 22, 20, 24, 18, 22, 20, 26,
    32, 38, 34
  ];

  function haversineKm(a, b) {
    const R = 6371;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(b[1] - a[1]);
    const dLng = toRad(b[0] - a[0]);
    const s =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  const distKm = [0];
  for (let i = 1; i < routeCoords.length; i++) {
    distKm[i] = distKm[i - 1] + haversineKm(routeCoords[i - 1], routeCoords[i]);
  }
  const totalKm = distKm[distKm.length - 1];
  let gain = 0;
  for (let i = 1; i < elevM.length; i++) {
    const d = elevM[i] - elevM[i - 1];
    if (d > 0) gain += d;
  }
  const elevMin = Math.min(...elevM);
  const elevMax = Math.max(...elevM);

  document.getElementById("stats").textContent =
    "~" + totalKm.toFixed(1) + " km sampled · +" + Math.round(gain) + " m gain · Verrazzano → Central Park";
  document.getElementById("elevRange").textContent =
    elevMin + "–" + elevMax + " m";

  function drawElevationBars() {
    const canvas = document.getElementById("elevCanvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const padL = 28;
    const padR = 8;
    const padT = 8;
    const padB = 18;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const n = elevM.length;
    const gap = 2;
    const barW = Math.max(2, (plotW - gap * (n - 1)) / n);
    const y0 = elevMin - 4;
    const y1 = elevMax + 6;

    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, h - padB);
    ctx.lineTo(w - padR, h - padB);
    ctx.stroke();

    ctx.fillStyle = "#6b7c93";
    ctx.font = "10px system-ui";
    ctx.fillText(Math.round(y1) + " m", 2, padT + 8);
    ctx.fillText(Math.round(y0) + " m", 2, h - padB);

    for (let i = 0; i < n; i++) {
      const t = (elevM[i] - y0) / (y1 - y0);
      const bh = Math.max(1, t * plotH);
      const x = padL + i * (barW + gap);
      const y = padT + plotH - bh;
      const hot = elevM[i] > 40;
      ctx.fillStyle = hot ? "#f59e0b" : "#38bdf8";
      ctx.fillRect(x, y, barW, bh);
    }

    ctx.fillStyle = "#9fb0c8";
    ctx.fillText("Start", padL, h - 4);
    ctx.fillText("Finish · Central Park", w - padR - 110, h - 4);
  }

  drawElevationBars();

  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [-73.98, 40.72],
    zoom: 10
  });

  map.on("load", () => {
    map.addSource("marathon-route", {
      type: "geojson",
      data: {
        type: "Feature",
        properties: { name: "NYC Marathon" },
        geometry: { type: "LineString", coordinates: routeCoords }
      }
    });
    map.addLayer({
      id: "marathon-route",
      type: "line",
      source: "marathon-route",
      paint: {
        "line-color": "#ef4444",
        "line-width": 4,
        "line-opacity": 0.9
      }
    });

    new maplibregl.Marker({ color: "#22c55e" })
      .setLngLat(routeCoords[0])
      .setPopup(new maplibregl.Popup().setText("Start · Verrazzano / Staten Island"))
      .addTo(map);
    new maplibregl.Marker({ color: "#ef4444" })
      .setLngLat(routeCoords[routeCoords.length - 1])
      .setPopup(new maplibregl.Popup().setText("Finish · Central Park"))
      .addTo(map);

    const bounds = routeCoords.reduce(
      (b, c) => b.extend(c),
      new maplibregl.LngLatBounds(routeCoords[0], routeCoords[0])
    );
    map.fitBounds(bounds, { padding: { top: 72, bottom: 160, left: 40, right: 40 }, duration: 900 });
  });

  window.__MAP__ = map;
</script>
</body>
</html>
