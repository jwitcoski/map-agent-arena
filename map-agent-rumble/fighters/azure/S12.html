<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S12 Layer Studio - Azure</title>
  <!-- Agent skills: https://github.com/MicrosoftDocs/Agent-Skills/tree/main/skills/azure-maps | install: npx skills add MicrosoftDocs/Agent-Skills --skill azure-maps -a cursor | local: .agents/skills/azure-maps -->
  <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" type="text/css" />
  <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
  <script src="../../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: absolute; z-index: 2; top: 10px; left: 10px;
      background: rgba(10,16,32,.92); color: #eef2ff; padding: 10px 12px;
      border-radius: 10px; max-width: min(320px, 92vw); font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .panel button, .panel input {
      font: inherit; margin: 4px 0; width: 100%; box-sizing: border-box;
      border-radius: 8px; border: 1px solid #445; padding: 10px; min-height: 44px;
      background: #0f172a; color: #eef2ff; cursor: pointer; touch-action: manipulation;
    }
    .panel button { background: #2563eb; border-color: #3b82f6; }
    .legend { position: absolute; z-index: 2; bottom: 28px; left: 10px;
      background: rgba(10,16,32,.9); color: #eef2ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #inset, #overview {
      position: absolute; z-index: 2; right: 10px; bottom: 28px;
      width: 140px; height: 110px; border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    }
    .story { position: absolute; z-index: 2; top: 10px; right: 10px; width: min(280px, 40vw);
      max-height: 80vh; overflow: auto; background: rgba(10,16,32,.94); color: #eef2ff;
      padding: 12px; border-radius: 10px; }
    .story .chapter { border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 0; cursor: pointer; }
    .story .chapter.active { color: #6ec8ff; }
    .swipe-wrap { position: absolute; inset: 0; }
    .swipe-wrap #mapA, .swipe-wrap #mapB { position: absolute; inset: 0; }
    .swipe-bar { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 5; cursor: ew-resize; }
    @media (max-width: 520px) {
      .panel { max-width: 96vw; left: 2vw; right: 2vw; width: auto; }
      .panel button { min-height: 48px; padding: 12px; }
    }
</style>
</head>
<body>

<div class="panel">
  <strong>Layer studio</strong>
  <label><input type="checkbox" data-layer="heat" checked /> Heat circles</label>
  <label><input type="checkbox" data-layer="line" checked /> Corridor</label>
  <label><input type="checkbox" data-layer="pts" checked /> Sites</label>
  <label>Opacity <input id="op" type="range" min="0" max="100" value="70" /></label>
  <label>Filter <input id="filt" type="range" min="0" max="10" value="0" /></label>
  <div class="legend">Legend: heat · corridor · sites</div>
</div>
<div id="map"></div>
<script>

  const key = window.AZURE_MAPS_SUBSCRIPTION_KEY;
  const map = new atlas.Map("map", {
    center: [14.4178, 50.1167],
    zoom: 12,
    authOptions: { authType: "subscriptionKey", subscriptionKey: key }
    
  });
  map.events.add("ready", () => {
    const heatDs = new atlas.source.DataSource();
    const lineDs = new atlas.source.DataSource();
    const ptsDs = new atlas.source.DataSource();
    map.sources.add([heatDs, lineDs, ptsDs]);
    heatDs.add([
      new atlas.data.Feature(new atlas.data.Point([14.42, 50.11]), { r: 600 }),
      new atlas.data.Feature(new atlas.data.Point([14.40, 50.09]), { r: 500 })
    ]);
    lineDs.add(new atlas.data.Feature(new atlas.data.LineString([[14.40, 50.12], [14.43, 50.08]])));
    ptsDs.add([
      new atlas.data.Feature(new atlas.data.Point([14.41, 50.10])),
      new atlas.data.Feature(new atlas.data.Point([14.42, 50.085]))
    ]);
    const heat = new atlas.layer.BubbleLayer(heatDs, "heat", { radius: 30, color: "#f87171", opacity: 0.35 });
    const line = new atlas.layer.LineLayer(lineDs, "line", { strokeColor: "#6ec8ff", strokeWidth: 4 });
    const pts = new atlas.layer.SymbolLayer(ptsDs, "pts", {});
    map.layers.add([heat, line, pts]);
    const layers = { heat, line, pts };
    document.querySelectorAll("[data-layer]").forEach((el) => {
      el.addEventListener("change", () => {
        layers[el.getAttribute("data-layer")].setOptions({ visible: el.checked });
      });
    });
    document.getElementById("op").oninput = (e) => {
      const o = Number(e.target.value) / 100;
      heat.setOptions({ opacity: o * 0.5 });
      line.setOptions({ strokeOpacity: o });
    };
    
      ptsDs.clear();
      if (n < 1) ptsDs.add(new atlas.data.Feature(new atlas.data.Point([14.41, 50.10])));
      if (n < 2) ptsDs.add(new atlas.data.Feature(new atlas.data.Point([14.42, 50.085])));
    };
    window.__MAP__ = map;
  });
</script>
</body>
</html>
